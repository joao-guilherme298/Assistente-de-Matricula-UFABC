name: Atualizar Dados PROGRAD

on:
  workflow_dispatch:
  schedule:
    # Roda toda segunda-feira às 09:00 (BRT / 12:00 UTC)
    - cron: "0 12 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Baixar PDFs mais recentes da PROGRAD e exportar JSONs
        run: python scripts/exportar_web.py --atualizar
      - name: Commit e push se houver atualização
        run: |
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/
            git commit -m "chore: atualizar dados publicos da PROGRAD UFABC"
            git push
          else
            echo "Nenhuma atualização nova encontrada na PROGRAD."
          fi
